name: Apply share metadata

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply TGR V12 share metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '    <title>Your Vacation | Treinamento</title>'
          new = '''    <title>TREINANDO TGR V12 | Treinamento Comercial</title>
    <meta name="description" content="Treinamento Comercial TGR">
    <meta property="og:title" content="TREINANDO TGR V12">
    <meta property="og:description" content="Treinamento Comercial TGR">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://lucastigrereal-dev.github.io/TREINANDO_TGR_V12/">'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old title, found {s.count(old)}')
          if 'property="og:title"' in s:
              raise SystemExit('og:title already exists; refusing duplicate metadata')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          grep -F '<title>TREINANDO TGR V12 | Treinamento Comercial</title>' index.html
          grep -F '<meta property="og:title" content="TREINANDO TGR V12">' index.html
          grep -F '<meta property="og:description" content="Treinamento Comercial TGR">' index.html
          grep -F '<meta property="og:url" content="https://lucastigrereal-dev.github.io/TREINANDO_TGR_V12/">' index.html
      - name: Check existing inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/app-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app-inline.js
      - name: Commit metadata fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-share-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: update WhatsApp share preview to TGR V12'
          git push
