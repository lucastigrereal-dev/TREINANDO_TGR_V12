name: Rename repository once
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-repo-once.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Rename repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl --fail-with-body -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/lucastigrereal-dev/TREINANDO-COM-YOUR \
            -d '{"name":"TREINANDO_TGR_V12"}'
