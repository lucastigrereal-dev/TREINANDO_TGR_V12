name: Apply corrected index

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-corrected-index.yml'

permissions:
  contents: write

jobs:
  fix-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply exact syntax fix and verify uploaded artifact hash
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "wrongWhy:{A:'Absolutiza sem base.',C:'Ameaca.',D:'Negociacao cedo demais.'}}\n  {module:'Arsenal',type:'Roleplay'"
          new = "wrongWhy:{A:'Absolutiza sem base.',C:'Ameaca.',D:'Negociacao cedo demais.'}},\n  {module:'Arsenal',type:'Roleplay'"

          if new in text:
              print('Syntax fix already present.')
          elif old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Applied missing comma fix.')
          else:
              raise SystemExit('Expected patch location was not found. Refusing to modify an unknown version.')

          html = path.read_text(encoding='utf-8')
          start = html.rfind('<script>')
          end = html.rfind('</script>')
          if start < 0 or end <= start:
              raise SystemExit('Inline script block not found.')
          Path('/tmp/app-inline.js').write_text(html[start + len('<script>'):end], encoding='utf-8')
          PY

          node --check /tmp/app-inline.js

          EXPECTED='5b230fbb6eb7d3634b42a495fe43822fed89b5cd9055e1a25c0bc8e26cfb78cf'
          ACTUAL="$(sha256sum index.html | awk '{print $1}')"
          echo "Expected SHA256: $EXPECTED"
          echo "Actual   SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Commit verified correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-corrected-index.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-corrected-index.yml
          git diff --cached --check
          git commit -m 'Fix quiz JavaScript syntax and restore interactions'
          git push origin main
